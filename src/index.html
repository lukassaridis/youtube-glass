<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Glass</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-tauri-drag-region>
    <header class="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>YouTube Glass</span>
      <div class="spacer" data-tauri-drag-region></div>
      <div class="controls">
        <button type="button" id="reload" title="Reload YouTube">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 3.2a4.8 4.8 0 1 1-4.4 3H5.2A3.2 3.2 0 1 0 8 4.8V6.4L11 4 8 1.6V3.2Z" />
          </svg>
        </button>
        <button type="button" id="min" title="Minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 8.4h10v1.2H3V8.4Z" />
          </svg>
        </button>
        <button type="button" id="max" title="Maximize">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 3.5h9v9h-9v-9Zm1.2 1.2v6.6h6.6V4.7H4.7Z" />
          </svg>
        </button>
        <button type="button" id="close" class="close" title="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="m4.2 3.4 3.8 3.8 3.8-3.8 1 1-3.8 3.8 3.8 3.8-1 1-3.8-3.8-3.8 3.8-1-1 3.8-3.8-3.8-3.8 1-1Z" />
          </svg>
        </button>
      </div>
    </header>
    <script src="main.js"></script>
  </body>
</html>
